name: ARENA ZERO quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript module syntax
        run: node --input-type=module --check < src/main.js
      - name: Run project smoke checks
        run: node scripts/smoke-check.mjs
      - name: Test FPS movement controller
        run: node scripts/fps-controller-test.mjs
      - name: Test weapon state machine
        run: node scripts/weapon-system-test.mjs
      - name: Test combat and hitscan
        run: node scripts/combat-test.mjs
      - name: Test tactical AI and navigation
        run: node scripts/tactical-ai-test.mjs
      - name: Test destructible cover and collision proxies
        run: node scripts/cover-system-test.mjs
      - name: Test coordinated enemy squad tactics
        run: node scripts/squad-tactics-test.mjs
      - name: Test directional threat awareness
        run: node scripts/threat-awareness-test.mjs
      - name: Benchmark 22-enemy cover-aware pathfinding
        run: node scripts/tactical-ai-benchmark.mjs
      - name: Validate generated VTK meshes
        run: node scripts/vtk-asset-test.mjs
